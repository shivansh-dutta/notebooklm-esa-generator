[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notebooklm-esa-generator"
version = "0.1.0"
description = "NotebookLM-driven Phase 1 ESA report generator (standalone)"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
notebooklm = [
    # Pinned to the known-good version this repo was extracted and verified
    # against — notebooklm-py wraps undocumented Google endpoints, so an
    # unpinned upgrade could silently change or break behavior.
    "notebooklm-py[browser]==0.7.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "scripts*", "notebooklm_pipeline*"]

[tool.pytest.ini_options]
pythonpath = ["."]
